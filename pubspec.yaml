name: pgo
description: "A new Flutter project for PGO application."

publish_to: 'none'

version: 1.0.0+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI & Navigation
  cupertino_icons: ^1.0.2
  go_router: ^13.0.0

  # State Management
  provider: ^6.0.0

  # API & Networking
  http: ^1.1.0
  dio: ^5.3.0
  image_picker: ^1.1.2
  mobile_scanner: ^7.1.1
  qr_flutter: ^4.1.0
  share_plus: ^10.1.4
  url_launcher: ^6.3.1

  # Local Storage
  shared_preferences: ^2.2.0
  sqflite: ^2.3.0

  # Utils
  intl: ^0.20.2
  google_sign_in: ^7.2.0
  google_fonts: ^6.3.2
  app_links: ^7.0.0
  firebase_core: ^4.7.0
  firebase_messaging: ^16.2.0
  flutter_local_notifications: ^21.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Linting
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/

flutter_launcher_icons:
  android: true
  ios: false
  web:
    generate: true
  image_path: "web/icons/icono-oficial.png"

